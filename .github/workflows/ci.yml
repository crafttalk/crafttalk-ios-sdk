name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sdk-sync:
    name: Check SDK matches its copy in Example
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compare CTChat with Example/Chat/CTChat
        shell: bash
        run: |
          mkdir -p artifacts/ci
          python3 scripts/sync-sdk.py --check 2>&1 | tee artifacts/ci/sdk-sync.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdk-sync-${{ github.run_attempt }}
          path: artifacts/ci/
          retention-days: 14
          if-no-files-found: warn

  build-sdk:
    name: Build SDK
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      EXPECTED_XCODE_VERSION: '16.4'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build SDK for iOS Simulator
        run: bash scripts/ci.sh build-spm
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdk-build-${{ github.run_attempt }}
          path: artifacts/ci/
          retention-days: 14
          if-no-files-found: warn

  test-sdk:
    name: Test SDK
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      EXPECTED_XCODE_VERSION: '16.4'
      SIMULATOR_OS: '18.6'
      SIMULATOR_DEVICE: iPhone 16
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run SDK tests on iOS Simulator
        run: bash scripts/ci.sh test-spm
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdk-tests-${{ github.run_attempt }}
          path: artifacts/ci/
          retention-days: 14
          if-no-files-found: warn

  example:
    name: Build Example app
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      EXPECTED_XCODE_VERSION: '16.4'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build Example without signing
        run: bash scripts/ci.sh build-example
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: example-${{ github.run_attempt }}
          path: artifacts/ci/
          retention-days: 14
          if-no-files-found: warn
