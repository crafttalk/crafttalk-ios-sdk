name: Simulator tests — manual

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk-sync:
    name: Check SDK matches its copy in Example
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compare CTChat with Example/Chat/CTChat
        shell: bash
        run: |
          mkdir -p artifacts/ci
          python3 scripts/sync-sdk.py --check 2>&1 | tee artifacts/ci/sdk-sync.log
      - name: Test CI helpers
        shell: bash
        run: python3 -m unittest discover -s scripts/tests -v 2>&1 | tee artifacts/ci/python-tests.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdk-sync-${{ github.run_attempt }}
          path: artifacts/ci/
          retention-days: 14
          if-no-files-found: warn

  test-sdk:
    name: Test SDK
    needs: sdk-sync
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      EXPECTED_XCODE_VERSION: '16.4'
      SIMULATOR_OS: '18.6'
      SIMULATOR_DEVICE: iPhone 16
      CI_HELPER_TESTS_CHECKED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run SDK tests on iOS Simulator
        run: bash scripts/ci.sh test-spm
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdk-tests-${{ github.run_attempt }}
          path: artifacts/ci/
          retention-days: 14
          if-no-files-found: warn

  test-webkit:
    name: Test WebKit user flows (${{ matrix.shard }}/4)
    needs: sdk-sync
    # ARM-пул не выдал runners трём UI-частям; оставляем его только для Test SDK.
    runs-on: macos-15-intel
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      EXPECTED_XCODE_VERSION: '16.4'
      SIMULATOR_OS: '18.6'
      SIMULATOR_DEVICE: iPhone 16
      UI_TEST_MANIFEST: .build/ci/ui-shards/shard-${{ matrix.shard }}.json
      CI_HELPER_TESTS_CHECKED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select UI test shard
        run: python3 scripts/split-ui-tests.py --count 4 --output-dir .build/ci/ui-shards
      - name: Run WebKit UI tests on iOS Simulator
        run: bash scripts/ci.sh test-ui
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: webkit-tests-${{ matrix.shard }}-${{ github.run_attempt }}
          path: artifacts/ci/
          retention-days: 14
          if-no-files-found: warn
